  :root {

    --c-surface: #1A2535;
    --c-border: #243044;
    --c-border2: #2E3D55;
    --c-text: #E8EDF2;
    --c-text2: #A8B4C4;
    --c-text3: #607080;
    --c-green: #4ADE80;
    --c-green-bg: rgba(74,222,128,0.10);
    --c-red: #F87171;
    --c-orange: #F5C842;
    --c-orange-bg: rgba(245,200,66,0.10);
    --c-accent: #60A5FA;
    --c-accent-bg: rgba(96,165,250,0.10);
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--c-bg); color: var(--c-text); min-height: 100vh; }

  /* Layout */
  .app { max-width: 1500px; margin: 0 auto; padding: 0 0 100px; }

  /* Grillas de escritorio: en pantallas anchas los ítems van lado a lado */
  @media (min-width: 900px) {
    .app { padding-left: 16px; padding-right: 16px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; align-items: start; }
    .cards-grid .item-card { margin-bottom: 0; }
    .cards-grid-lg { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 10px; align-items: start; }
    .cards-grid-lg .prov-block, .cards-grid-lg .esc-card { margin-bottom: 0; }
  }
  .hdr { background: linear-gradient(135deg, #0F1923 0%, #1A2535 100%); border-bottom: 1px solid #243044; padding: 1.2rem 1rem; }
  .hdr h1 { font-size: 1.15rem; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
  .hdr p  { font-size: 0.72rem; color: rgba(255,255,255,0.65); margin-top: 3px; }
  .hdr-provs { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
  .hdr-prov { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.12); padding: 3px 8px; border-radius: 20px; border: none; cursor: pointer; font-family: inherit; }
  .hdr-prov span { font-size: 0.7rem; color: #fff; }
  .hdr-prov.off { background: rgba(255,255,255,0.05); }
  .hdr-prov.off span { color: rgba(255,255,255,0.4); text-decoration: line-through; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* Tabs */
  .tabs-wrap { position: sticky; top: 0; z-index: 100; background: #0F1923; border-bottom: 1px solid var(--c-border); }
  .tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { flex-shrink: 0; padding: 12px 14px; border: none; background: transparent; font-size: 0.78rem; font-weight: 500; color: var(--c-text3); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
  .tab-btn.active { color: var(--c-green); border-bottom-color: var(--c-green); font-weight: 600; }

  /* Secciones */
  .section { margin: 12px 10px 0; }
  .section-title { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--c-text3); padding: 8px 0 4px; }

  /* Cards */
  .card { background: var(--c-surface); border-radius: var(--radius); border: 1px solid var(--c-border); padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .card.green  { border-color: var(--c-green); background: var(--c-green-bg); }
  .card.orange { border-color: #F59E0B; background: var(--c-orange-bg); }
  .card.red    { border-color: #FCA5A5; background: rgba(160,41,28,0.04); }

  /* Compras */
  .compras-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  @media(max-width:480px){ .compras-grid { grid-template-columns: repeat(2, 1fr); } }
  .compra-card { background: var(--c-surface); border-radius: var(--radius-sm); border: 1.5px solid var(--c-border); padding: 8px 10px; }
  .compra-card.activa { border-color: var(--accent-color, #1B6B45); }
  .compra-nombre { font-size: 0.72rem; font-weight: 600; }
  .compra-monto { font-size: 1rem; font-weight: 700; margin-top: 2px; }
  .compra-bar-wrap { height: 3px; background: var(--c-border); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .compra-bar { height: 100%; border-radius: 2px; }
  .compra-pct { font-size: 0.65rem; color: var(--c-text3); margin-top: 2px; }

  /* Items móvil — card por ítem */
  .item-card { background: var(--c-surface); border-radius: var(--radius-sm); border: 1px solid var(--c-border); margin-bottom: 6px; overflow: hidden; }
  .item-header { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; cursor: pointer; }
  .item-nombre { font-size: 0.82rem; font-weight: 500; flex: 1; }
  .item-winner { font-size: 0.7rem; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: var(--c-green-bg); color: var(--c-green); flex-shrink: 0; margin-left: 8px; }
  .item-body { border-top: 1px solid var(--c-border); }
  .item-prov-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; border-bottom: 0.5px solid var(--c-border); }
  .item-prov-row:last-child { border-bottom: none; }
  .item-prov-row.winner { background: var(--c-green-bg); }
  .item-prov-name { font-size: 0.75rem; display: flex; align-items: center; gap: 5px; }
  .item-prov-right { text-align: right; }
  .item-prov-total { font-size: 0.82rem; font-weight: 600; }
  .item-prov-unit  { font-size: 0.68rem; color: var(--c-text3); }
  .rank-chip { font-size: 0.6rem; padding: 1px 4px; border-radius: 3px; }
  .rank-1 { background: var(--c-green-bg); color: var(--c-green); }
  .rank-2 { background: var(--c-accent-bg); color: var(--c-accent); }
  .rank-n { background: rgba(0,0,0,0.06); color: var(--c-text3); }

  /* Subtotal categoría */
  .cat-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px 4px; cursor: pointer; }
  .cat-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--c-text2); }
  .cat-toggle { font-size: 0.7rem; color: var(--c-text3); }
  .cat-toggle-btn { font-size: 0.62rem; font-weight: 600; background: transparent; border: 1px solid var(--c-border2); color: var(--c-text3); border-radius: 4px; padding: 3px 8px; cursor: pointer; font-family: inherit; }

  /* Mix óptimo */
  .prov-block { background: var(--c-surface); border-radius: var(--radius); border: 1px solid var(--c-border); margin-bottom: 10px; overflow: hidden; }
  .prov-block-hdr { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--c-border); }
  .prov-block-nombre { font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .prov-block-total  { font-size: 0.9rem; font-weight: 700; }
  .mix-item-row { display: flex; justify-content: space-between; padding: 7px 14px; border-bottom: 0.5px solid var(--c-border); font-size: 0.8rem; }
  .mix-item-row:last-child { border-bottom: none; }
  .mix-item-nombre { color: var(--c-text2); flex: 1; }
  .mix-item-right { text-align: right; }
  .mix-item-total { font-weight: 600; }
  .mix-item-ahorro { font-size: 0.68rem; color: var(--c-green); }

  /* Total box */
  .total-box { background: var(--c-green-bg); border: 1.5px solid var(--c-green); border-radius: var(--radius); padding: 1.2rem; text-align: center; margin: 12px 0; }
  .total-box-label { font-size: 0.72rem; color: var(--c-green); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .total-box-amount { font-size: 1.8rem; font-weight: 800; color: var(--c-green); letter-spacing: -0.03em; }
  .total-box-sub { font-size: 0.75rem; color: var(--c-text3); margin-top: 4px; }

  /* Escenarios */
  .esc-card { background: var(--c-surface); border-radius: var(--radius); border: 1px solid var(--c-border); margin-bottom: 8px; overflow: hidden; }
  .esc-card.best { border-color: var(--c-green); border-width: 2px; background: var(--c-green-bg); }
  .esc-card.base { border-color: #FCA5A5; }
  .esc-hdr { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 14px; cursor: pointer; gap: 8px; }
  .esc-label { font-size: 0.88rem; font-weight: 700; }
  .esc-sub   { font-size: 0.7rem; color: var(--c-text3); margin-top: 2px; }
  .esc-right { text-align: right; flex-shrink: 0; }
  .esc-total { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em; }
  .esc-pct   { font-size: 0.75rem; font-weight: 600; color: var(--c-green); }
  .bar-wrap  { height: 6px; background: var(--c-bg); margin: 0 14px 10px; border-radius: 3px; overflow: hidden; }
  .bar       { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .esc-chips { display: flex; gap: 5px; flex-wrap: wrap; padding: 0 14px 10px; }
  .chip { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: 500; }
  .chip-green  { background: var(--c-green-bg);  color: var(--c-green);  }
  .chip-blue   { background: var(--c-accent-bg); color: var(--c-accent); }
  .chip-red    { background: rgba(160,41,28,0.08); color: var(--c-red); }
  .chip-orange { background: var(--c-orange-bg); color: var(--c-orange); }
  .chip-grey   { background: rgba(0,0,0,0.05); color: var(--c-text3); }
  .esc-provs   { display: flex; gap: 5px; flex-wrap: wrap; padding: 0 14px 12px; }
  .prov-pill   { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 500; }

  /* Escenarios tabla resumen */
  .resumen-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  .resumen-table th { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--c-border); font-weight: 600; color: var(--c-text3); font-size: 0.7rem; background: #131E2C; }
  .resumen-table th:first-child { text-align: left; }
  .resumen-table td { padding: 8px 10px; border-bottom: 0.5px solid var(--c-border); text-align: right; }
  .resumen-table td:first-child { text-align: left; font-weight: 500; }
  .resumen-table tr.best-row { background: var(--c-green-bg); font-weight: 700; }
  .resumen-table tr.best-row td { color: var(--c-green); }

  /* Alertas */
  .alerta { display: flex; gap: 8px; padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 0.75rem; }
  .alerta.warn   { background: var(--c-orange-bg); border: 1px solid #F59E0B; color: #92400E; }
  .alerta.info   { background: var(--c-green-bg);  border: 1px solid var(--c-green); color: var(--c-green); }
  .alerta.pend   { background: #FFF9C4; border: 1px solid #F59E0B; color: #92400E; }
  .alerta-icon   { flex-shrink: 0; font-size: 0.9rem; }

  /* Input compra */
  .compra-input { width: 100%; padding: 4px 6px; font-size: 0.85rem; font-weight: 700; border: 1.5px solid; border-radius: 4px; outline: none; background: transparent; }
  .compra-add-btn { margin-top: 5px; width: 100%; padding: 3px 0; font-size: 0.65rem; font-weight: 600; background: transparent; border: 1px dashed; border-radius: 4px; cursor: pointer; }

  /* Pendiente tag */
  .pend-tag { font-size: 0.62rem; background: #FFF9C4; color: #92400E; padding: 1px 5px; border-radius: 3px; }
  .consultar { font-size: 0.7rem; color: #92400E; font-style: italic; }

  /* Faltantes */
  .stepper { display: inline-flex; align-items: center; gap: 3px; }
  .stepper button { width: 27px; height: 27px; border-radius: 6px; border: 1px solid var(--c-border2); background: var(--c-bg); color: var(--c-text2); font-size: 1rem; line-height: 1; cursor: pointer; flex-shrink: 0; }
  .stepper button:active { background: var(--c-border); }
  .stepper input { width: 54px; text-align: center; background: transparent; border: 1px solid var(--c-border); border-radius: 6px; color: var(--c-text); font-size: 0.85rem; font-weight: 700; padding: 4px 2px; outline: none; }
  .falt-label { font-size: 0.6rem; color: var(--c-text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
</style>
</head>

// ── HELPERS ──────────────────────────────────────────────────────────────────
function pu(prov,id){ const r=prov.p[id]; if(!r)return null; return r*(1-prov.desc/100); }
function fmt(n){ if(!n||isNaN(n))return'—'; return "$"+Math.round(n).toLocaleString("es-AR"); }
function fmtM(n){ if(!n||isNaN(n))return'—'; return "$"+(n/1000000).toFixed(2)+"M"; }
function isPend(prov,id){ return prov.pendientes&&prov.pendientes.includes(id); }

function rankingItem(itemId,cant,provs){
  return (provs||PROVEEDORES).map(p=>{ const u=pu(p,itemId); return u&&u>0?{prov:p,u,total:u*cant}:null; }).filter(Boolean).sort((a,b)=>a.total-b.total);
}

function calcMix(provs,items){
  const mix={};let total=0;
  (items||TODOS_ITEMS).forEach(item=>{
    const rank=rankingItem(item.id,item.cant,provs);
    if(!rank.length)return;
    const g=rank[0],seg=rank[1]||null;
    if(!mix[g.prov.id])mix[g.prov.id]={prov:g.prov,items:[],subtotal:0};
    mix[g.prov.id].items.push({...item,u:g.u,total:g.total,seg});
    mix[g.prov.id].subtotal+=g.total; total+=g.total;
  });
  return{mix,total};
}

function totalProv(provId){
  const prov=PROVEEDORES.find(p=>p.id===provId);
  return TODOS_ITEMS.reduce((a,i)=>{ const u=pu(prov,i.id); return a+(u&&u>0?u*i.cant:0); },0);
}

function bestUno(provs,items){
  const lista=items||TODOS_ITEMS;
  let best=null;
  provs.forEach(p=>{
    let total=0,desglose={},fuera=0,cob=0;
    lista.forEach(item=>{
      let u=pu(p,item.id),prov=p;
      if(!u||u<=0){
        const alt=provs.filter(q=>q.id!==p.id)
          .map(q=>{const v=pu(q,item.id);return v&&v>0?{prov:q,u:v}:null;})
          .filter(Boolean).sort((a,b)=>a.u-b.u)[0];
        if(!alt)return;
        u=alt.u; prov=alt.prov; fuera++;
      }
      const t=u*item.cant; total+=t; cob++;
      if(!desglose[prov.id])desglose[prov.id]={prov:prov,items:[],subtotal:0};
      desglose[prov.id].items.push({...item,u:u,total:t,seg:null});
      desglose[prov.id].subtotal+=t;
    });
    if(cob===0)return;
    const r={s:Object.keys(desglose),total,desglose,cob,mainId:p.id,fuera};
    if(!best||total<best.total)best=r;
  });
  return best;
}

function combis(arr,n){
  if(n===1)return arr.map(x=>[x]);
  const r=[];
  for(let i=0;i<arr.length-n+1;i++)
    combis(arr.slice(i+1),n-1).forEach(c=>r.push([arr[i],...c]));
  return r;
}

function calcSet(ids,items){
  const ps=PROVEEDORES.filter(p=>ids.includes(p.id));
  let total=0,cob=0,desglose={};
  const lista=items||TODOS_ITEMS;
  lista.forEach(item=>{
    const ops=ps.map(p=>{const u=pu(p,item.id);return u&&u>0?{prov:p,u,t:u*item.cant}:null;}).filter(Boolean).sort((a,b)=>a.t-b.t);
    if(!ops.length)return;
    total+=ops[0].t; cob++;
    const pid=ops[0].prov.id;
    if(!desglose[pid])desglose[pid]={prov:ops[0].prov,items:[],subtotal:0};
    desglose[pid].items.push({...item,u:ops[0].u,total:ops[0].t,seg:ops[1]||null});
    desglose[pid].subtotal+=ops[0].t;
  });
  return{total,cob,desglose};
}

function bestN(n,ids,items){
  ids=ids||PROVEEDORES.map(p=>p.id);
  const lista=items||TODOS_ITEMS;
  if(ids.length<n||!lista.length)return null;
  return combis(ids,n).map(s=>({s,...calcSet(s,lista)})).filter(r=>r.cob===lista.length).sort((a,b)=>a.total-b.total)[0];
}

function App(){
  const [tab,setTab]=useState("faltantes");
  const [expandCat,setExpandCat]=useState({hierros:true,viguetas:true,otros:true,varios:false,etapa2_mamposteria:false,etapa2_refractarios:false,etapa2_insumos:false,calefaccion:false,cloaca:false,agua:false});
  const [expandItem,setExpandItem]=useState({});
  const [expandEsc,setExpandEsc]=useState({});
  const [compras,setCompras]=useState({caeiro:6003160.54,dasilva:5500000,lhhnos:0,curtoni:0,shnos:31264100,esperanza:1386766,casameli:0}); // shnos corregido -100 (factura real 11/08: $13.124.900, no $13.125.000)
  const [editCompra,setEditCompra]=useState(null);
  const [addCompra,setAddCompra]=useState(null);
  const [guardado,setGuardado]=useState(false);
  function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  const [addForm,setAddForm]=useState({monto:'',fecha:hoyISO(),nota:''});
  const [bitacora,setBitacora]=useState(()=>{
    try{ const s=localStorage.getItem(STORAGE_BITACORA); if(s)return JSON.parse(s); }catch(e){}
    return [];
  });
  function guardarBitacora(arr){ try{ localStorage.setItem(STORAGE_BITACORA,JSON.stringify(arr)); }catch(e){} }
  function eliminarBitacora(id){
    setBitacora(prev=>{
      const entry=prev.find(b=>b.id===id);
      const arr=prev.filter(b=>b.id!==id);
      guardarBitacora(arr);
      if(entry){
        setCompras(c=>{ const n={...c,[entry.provId]:Math.max(0,(c[entry.provId]||0)-entry.monto)}; guardarCompras(n); return n; });
      }
      return arr;
    });
  }
  const [activos,setActivos]=useState(()=>{
    try{ const s=localStorage.getItem(STORAGE_ACTIVOS); if(s)return {...ACTIVOS_DEFAULT,...JSON.parse(s)}; }catch(e){}
    return ACTIVOS_DEFAULT;
  });

  function toggleProv(id){
    setActivos(prev=>{
      const n={...prev,[id]:prev[id]===false?true:false};
      if(!Object.values(n).some(v=>v!==false))return prev;
      try{ localStorage.setItem(STORAGE_ACTIVOS,JSON.stringify(n)); }catch(e){}
      return n;
    });
  }

  const provsActivos=useMemo(()=>PROVEEDORES.filter(p=>activos[p.id]!==false),[activos]);
  const idsActivos=useMemo(()=>provsActivos.map(p=>p.id),[provsActivos]);

  const [itemsAct,setItemsAct]=useState(()=>{
    try{ const s=localStorage.getItem(STORAGE_ITEMS); if(s)return {...ITEMS_DEFAULT,...JSON.parse(s)}; }catch(e){}
    return ITEMS_DEFAULT;
  });
  function guardarItems(n){ try{ localStorage.setItem(STORAGE_ITEMS,JSON.stringify(n)); }catch(e){} }
  function toggleItem(id){
    setItemsAct(prev=>{ const n={...prev,[id]:prev[id]===false?true:false}; guardarItems(n); return n; });
  }
  function toggleCat(cat){
    setItemsAct(prev=>{
      const allOn=cat.items.every(i=>prev[i.id]!==false);
      const n={...prev}; cat.items.forEach(i=>{ n[i.id]=!allOn; });
      guardarItems(n); return n;
    });
  }
  const [cants,setCants]=useState(()=>{
    try{
      const s=localStorage.getItem(STORAGE_CANT);
      if(s){ const p=JSON.parse(s); const m={}; TODOS_ITEMS.forEach(i=>{ m[i.id]={...CANT_DEFAULT[i.id],...(p[i.id]||{})}; }); return m; }
    }catch(e){}
    return CANT_DEFAULT;
  });

  // Mix óptimo / Ahorro / Carrito usan lo que REALMENTE falta (Necesito − Compré),
  // no la cantidad total del ítem — así un ítem parcialmente comprado no se cobra completo de nuevo.
  // Ya no depende de itemsAct (era el tilde manual de la vieja pestaña Precios, eliminada):
  // acá entra TODO lo que todavía falta comprar, sin exclusiones manuales.
  const itemsActivos=useMemo(()=>TODOS_ITEMS
    .map(i=>{
      const c=cants[i.id]||CANT_DEFAULT[i.id]||{nec:i.cant,comp:0};
      const falt=Math.max(0,c.nec-c.comp);
      return falt>0?{...i,cant:falt}:null;
    }).filter(Boolean),[cants]);
  function setCant(id,campo,val){
    const v=Math.max(0,Math.round(Number(String(val).replace(/[^\d]/g,''))||0));
    setCants(prev=>{
      const n={...prev,[id]:{...prev[id],[campo]:v}};
      try{ localStorage.setItem(STORAGE_CANT,JSON.stringify(n)); }catch(e){}
      return n;
    });
  }

  // En cuanto un ítem queda 100% comprado en Faltantes, se saca solo de Precios/Mix óptimo/Ahorro
  // (no vuelve a tildarse solo si después se destildó a mano, ni si deja de estar completo)
  useEffect(()=>{
    setItemsAct(prev=>{
      let changed=false;
      const n={...prev};
      TODOS_ITEMS.forEach(i=>{
        const c=cants[i.id]||CANT_DEFAULT[i.id];
        const completo = c && c.nec>0 && c.comp>=c.nec;
        if(completo && n[i.id]!==false){ n[i.id]=false; changed=true; }
      });
      if(changed){ guardarItems(n); return n; }
      return prev;
    });
  },[cants]);

  // Cargar compras guardadas
  useState(()=>{
    try{ const s=localStorage.getItem(STORAGE_KEY); if(s)setCompras(JSON.parse(s)); }catch(e){}
  });

  function guardarCompras(nuevas){
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(nuevas)); setGuardado(true); setTimeout(()=>setGuardado(false),2000); }catch(e){}
  }
  function actualizarCompra(id,val){
    const n={...compras,[id]:Number(String(val).replace(/\D/g,''))||0};
    setCompras(n); guardarCompras(n); setEditCompra(null);
  }
  function abrirAdd(provId){ setAddForm({monto:'',fecha:hoyISO(),nota:''}); setAddCompra(provId); }
  function confirmarAdd(provId){
    const monto=Number(String(addForm.monto).replace(/\D/g,''))||0;
    if(monto>0){
      const n={...compras,[provId]:(compras[provId]||0)+monto};
      setCompras(n); guardarCompras(n);
      const entry={id:Date.now()+'_'+provId, fecha:addForm.fecha||hoyISO(), provId, monto, nota:addForm.nota||''};
      setBitacora(prev=>{ const arr=[entry,...prev]; guardarBitacora(arr); return arr; });
    }
    setAddCompra(null);
  }

  const [expandFalt,setExpandFalt]=useState(()=>{
    const m={};
    TODOS_ITEMS.forEach(i=>{ m[i.id]=false; });   // todo arranca colapsado
    return m;
  });

  // Fecha desde la que se empieza a medir el ritmo de consumo (para proyectar semanas de stock)
  const [fechaInicioConsumo,setFechaInicioConsumo]=useState(()=>{
    try{ const s=localStorage.getItem(STORAGE_CONSUMO_INICIO); if(s)return s; }catch(e){}
    return '';
  });
  function cambiarFechaInicioConsumo(v){
    setFechaInicioConsumo(v);
    try{ localStorage.setItem(STORAGE_CONSUMO_INICIO,v); }catch(e){}
  }
  const [mostrarReporte,setMostrarReporte]=useState(false);
  const [reporteCopiado,setReporteCopiado]=useState(false);
  const [expandResumenCat,setExpandResumenCat]=useState({}); // ausente = expandido

  const [pendCotizar,setPendCotizar]=useState(()=>{
    try{ const s=localStorage.getItem(STORAGE_PENDCOTIZAR); if(s)return JSON.parse(s); }catch(e){}
    return PENDIENTES_COTIZAR_DEFAULT;
  });
  const [editPend,setEditPend]=useState(null);
  function guardarPendCotizar(arr){ try{ localStorage.setItem(STORAGE_PENDCOTIZAR,JSON.stringify(arr)); }catch(e){} }
  function actualizarEstimadoPend(id,val){
    const n=Number(String(val).replace(/\D/g,''))||0;
    setPendCotizar(prev=>{ const arr=prev.map(x=>x.id===id?{...x,estimado:n}:x); guardarPendCotizar(arr); return arr; });
    setEditPend(null);
  }
  function eliminarPend(id){
    setPendCotizar(prev=>{ const arr=prev.filter(x=>x.id!==id); guardarPendCotizar(arr); return arr; });
  }

  const [carrito,setCarrito]=useState(()=>{
    try{ const s=localStorage.getItem(STORAGE_CARRITO); if(s)return JSON.parse(s); }catch(e){}
    return {};
  });
  const [ocultarProveedor,setOcultarProveedor]=useState(false);
  function guardarCarrito(n){ try{ localStorage.setItem(STORAGE_CARRITO,JSON.stringify(n)); }catch(e){} }
  function setCarritoQty(id,val){
    const v=Math.max(0,Math.round(Number(String(val).replace(/[^\d]/g,''))||0));
    setCarrito(prev=>{ const n={...prev}; if(v<=0)delete n[id]; else n[id]=v; guardarCarrito(n); return n; });
  }
  function toggleCarrito(id){
    setCarrito(prev=>{
      const n={...prev};
      if(n[id])delete n[id];
      else{ const c=cants[id]||CANT_DEFAULT[id]; const f=Math.max(0,c.nec-c.comp); n[id]=f>0?f:1; }
      guardarCarrito(n); return n;
    });
  }
  function cargarFaltantes(){
    const n={};
    TODOS_ITEMS.forEach(i=>{ const c=cants[i.id]||CANT_DEFAULT[i.id]; const f=Math.max(0,c.nec-c.comp); if(f>0)n[i.id]=f; });
    setCarrito(n); guardarCarrito(n);
  }
  function vaciarCarrito(){ setCarrito({}); guardarCarrito({}); }

  // Mix óptimo y Ahorro trabajan sobre el carrito cuando tiene algo tildado;
  // si el carrito está vacío, caen de nuevo a todos los faltantes.
  const cartActivos=useMemo(()=>TODOS_ITEMS.filter(i=>carrito[i.id]>0).map(i=>({...i,cant:carrito[i.id]})),[carrito]);
  const usaCarritoEnCalculo=cartActivos.length>0;
  const itemsParaCalculo=usaCarritoEnCalculo?cartActivos:itemsActivos;

  const {mix,total:totalMix}=useMemo(()=>calcMix(provsActivos,itemsParaCalculo),[provsActivos,itemsParaCalculo]);
  const totalComprado=Object.values(compras).reduce((a,b)=>a+b,0);

  const b1=useMemo(()=>bestUno(provsActivos,itemsParaCalculo),[provsActivos,itemsParaCalculo]);
  const b2=useMemo(()=>bestN(2,idsActivos,itemsParaCalculo),[idsActivos,itemsParaCalculo]);
  const b3=useMemo(()=>bestN(3,idsActivos,itemsParaCalculo),[idsActivos,itemsParaCalculo]);
  const mixAll=useMemo(()=>({s:idsActivos,...calcSet(idsActivos,itemsParaCalculo)}),[idsActivos,itemsParaCalculo]);
  const base=b1?.total||0;
  const nAct=provsActivos.length;

  const ESCENARIOS=[
    {n:1,label:"1 proveedor",     short:"1 prov.", r:b1,  isBase:true},
    {n:2,label:"2 proveedores",   short:"2 prov.", r:b2},
    {n:3,label:"3 proveedores",   short:"3 prov.", r:b3},
    {n:5,label:"Mix óptimo ("+nAct+")", short:"3 prov.", r:mixAll, isBest:true},
  ];

  // ── RENDER COMPRAS ─────────────────────────────────────────────────────────
  function renderCompras(){
    return e('div',{className:'section'},
      e('div',{className:'section-title'},'🛒 Compras realizadas'),
      e('div',{className:'compras-grid'},
        ...PROVEEDORES.map(p=>{
          const c=compras[p.id]||0;
          const pres=totalProv(p.id);
          const pct=pres>0?(c/pres*100):0;
          const isEdit=editCompra===p.id;
          const isAdd=addCompra===p.id;
          return e('div',{key:p.id,className:'compra-card'+(c>0?' activa':''),style:{'--accent-color':p.color}},
            e('div',{className:'compra-nombre',style:{color:p.color}},
              e('span',{className:'dot',style:{background:p.color}}),
              ' '+p.nombre,
              activos[p.id]===false&&e('span',{style:{fontSize:'0.58rem',color:'var(--c-text3)',fontWeight:400,marginLeft:4}},'excluido')
            ),
            isEdit
              ? e('input',{className:'compra-input',style:{borderColor:p.color,color:p.color},autoFocus:true,defaultValue:c||'',placeholder:'0',inputMode:'numeric',
                  onBlur:ev=>actualizarCompra(p.id,ev.target.value),
                  onKeyDown:ev=>{if(ev.key==='Enter')actualizarCompra(p.id,ev.target.value);if(ev.key==='Escape')setEditCompra(null);}})
              : e('div',{className:'compra-monto',style:{color:c>0?p.color:'#bbb',cursor:'pointer'},onClick:()=>setEditCompra(p.id)},
                  c>0?fmt(c):'—'
                ),
            isAdd
              ? e('div',{style:{marginTop:5,display:'flex',flexDirection:'column',gap:5}},
                  e('input',{className:'compra-input',style:{borderColor:p.color,color:p.color},autoFocus:true,placeholder:'Monto',inputMode:'numeric',
                    value:addForm.monto,onChange:ev=>setAddForm(f=>({...f,monto:ev.target.value})),
                    onKeyDown:ev=>{if(ev.key==='Enter')confirmarAdd(p.id);if(ev.key==='Escape')setAddCompra(null);}}),
                  e('input',{type:'date',className:'compra-input',style:{borderColor:p.color,color:p.color,fontSize:'0.68rem'},
                    value:addForm.fecha,onChange:ev=>setAddForm(f=>({...f,fecha:ev.target.value}))}),
                  e('input',{className:'compra-input',style:{borderColor:p.color,color:p.color,fontSize:'0.68rem'},placeholder:'Nota (opcional)',
                    value:addForm.nota,onChange:ev=>setAddForm(f=>({...f,nota:ev.target.value})),
                    onKeyDown:ev=>{if(ev.key==='Enter')confirmarAdd(p.id);if(ev.key==='Escape')setAddCompra(null);}}),
                  e('div',{style:{display:'flex',gap:6}},
                    e('button',{className:'compra-add-btn',style:{color:p.color,borderColor:p.color+'55',flex:1},onClick:()=>confirmarAdd(p.id)},'Guardar'),
                    e('button',{className:'compra-add-btn',style:{color:'var(--c-text3)',borderColor:'var(--c-border)',flex:1},onClick:()=>setAddCompra(null)},'Cancelar')
                  )
                )
              : !isEdit&&e('button',{className:'compra-add-btn',style:{color:p.color,borderColor:p.color+'55'},onClick:()=>abrirAdd(p.id)},'+ Sumar'),
            c>0&&e('div',null,
              e('div',{className:'compra-bar-wrap'},e('div',{className:'compra-bar',style:{width:Math.min(pct,100)+'%',background:p.color}})),
              e('div',{className:'compra-pct'},pct.toFixed(0)+'% · '+fmtM(pres))
            )
          );
        })
      ),
      e('div',{style:{fontSize:'0.72rem',color:'var(--c-text3)',marginTop:6,textAlign:'center'}},
        'Total comprado: '+fmt(totalComprado)+(guardado?' · ✓ Guardado':'') + ' · Tocá el monto para editar · + Sumar para agregar una compra'
      ),
      bitacora.length>0&&e('div',{style:{marginTop:14}},
        e('div',{className:'section-title',style:{fontSize:'0.8rem'}},'📜 Historial de compras ('+bitacora.length+')'),
        e('div',{style:{fontSize:'0.65rem',color:'var(--c-text3)',marginBottom:6}},'Solo registra lo que sumes de acá en adelante con "+ Sumar" · los totales viejos no tienen historial'),
        e('div',{style:{background:'var(--c-surface)',borderRadius:'var(--radius)',border:'1px solid var(--c-border)',overflow:'hidden'}},
          ...bitacora.map((b,idx)=>{
            const p=PROVEEDORES.find(x=>x.id===b.provId);
            return e('div',{key:b.id,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 10px',borderTop:idx>0?'1px solid var(--c-border)':'none',fontSize:'0.75rem'}},
              e('div',null,
                e('span',{style:{color:'var(--c-text3)'}},b.fecha+' · '),
                e('span',{style:{color:p?p.color:'inherit',fontWeight:600}},p?p.nombre:b.provId),
                b.nota&&e('span',{style:{color:'var(--c-text3)'}},' · '+b.nota)
              ),
              e('div',{style:{display:'flex',alignItems:'center',gap:8}},
                e('span',{style:{fontWeight:700}},fmt(b.monto)),
                e('button',{onClick:()=>eliminarBitacora(b.id),title:'Eliminar (también resta del total)',style:{fontSize:'0.7rem',color:'var(--c-red)',background:'none',border:'none',cursor:'pointer'}},'✕')
              )
            );
          })
        )
      )
    );
  }

  // ── RENDER COMPARACIÓN ─────────────────────────────────────────────────────
  function renderComparacion(){
    return e('div',null,
      ...CATEGORIAS.map(cat=>{
        const exp=expandCat[cat.id];
        const nOn=cat.items.filter(i=>itemsAct[i.id]!==false).length;
        const allOn=nOn===cat.items.length;
        return e('div',{key:cat.id,className:'section'},
          e('div',{className:'cat-header',onClick:()=>setExpandCat(x=>({...x,[cat.id]:!x[cat.id]}))},
            e('div',{style:{display:'flex',alignItems:'center',gap:6}},
              e('span',{className:'cat-label'},cat.nombre),
              e('span',{style:{fontSize:'0.65rem',color:nOn===0?'var(--c-text3)':'var(--c-green)'}},nOn+'/'+cat.items.length)
            ),
            e('div',{style:{display:'flex',alignItems:'center',gap:8}},
              e('button',{className:'cat-toggle-btn',onClick:ev=>{ev.stopPropagation();toggleCat(cat);}},allOn?'Omitir todo':'Incluir todo'),
              e('span',{className:'cat-toggle'},exp?'▲':'▼')
            )
          ),
          exp&&e('div',{className:'cards-grid'},
            ...cat.items.map(item=>{
              const on=itemsAct[item.id]!==false;
              const rank=rankingItem(item.id,item.cant,provsActivos);
              const ganador=rank[0]?.prov;
              const isExpItem=expandItem[item.id];
              return e('div',{key:item.id,className:'item-card',style:on?null:{opacity:0.45}},
                e('div',{className:'item-header',onClick:()=>setExpandItem(x=>({...x,[item.id]:!x[item.id]}))},
                  e('input',{type:'checkbox',checked:on,onClick:ev=>ev.stopPropagation(),onChange:()=>toggleItem(item.id),
                    style:{width:16,height:16,accentColor:'#4ADE80',flexShrink:0,marginRight:9,cursor:'pointer'}}),
                  e('span',{className:'item-nombre',style:on?null:{textDecoration:'line-through',color:'var(--c-text3)'}},item.nombre+' ×'+item.cant),
                  !on
                    ? e('span',{className:'item-winner',style:{background:'rgba(0,0,0,0.2)',color:'var(--c-text3)'}},'omitido')
                    : ganador&&e('span',{className:'item-winner',style:{background:ganador.color+'18',color:ganador.color}},ganador.nombre)
                ),
                isExpItem&&e('div',{className:'item-body'},
                  ...provsActivos.map((p,idx)=>{
                    const u=pu(p,item.id);
                    const t=u?u*item.cant:null;
                    const pos=rank.findIndex(r=>r.prov.id===p.id);
                    const isWin=pos===0&&t!==null;
                    const pend=isPend(p,item.id)&&!t;
                    return e('div',{key:p.id,className:'item-prov-row'+(isWin?' winner':'')},
                      e('div',{className:'item-prov-name'},
                        e('span',{className:'dot',style:{background:p.color}}),
                        p.nombre,
                        pos>=0&&e('span',{className:'rank-chip '+(pos===0?'rank-1':pos===1?'rank-2':'rank-n'),style:{marginLeft:4}},pos+1+'°')
                      ),
                      pend
                        ? e('span',{className:'consultar'},'consultar')
                        : t!==null
                          ? e('div',{className:'item-prov-right'},
                              e('div',{className:'item-prov-total',style:{color:isWin?p.color:'inherit'}},fmt(t)),
                              e('div',{className:'item-prov-unit'},fmt(u)+'/u')
                            )
                          : e('span',{style:{fontSize:'0.7rem',color:'var(--c-text3)'}},'—')
                    );
                  })
                )
              );
            })
          )
        );
      })
    );
  }

  // ── RENDER MIX ÓPTIMO ──────────────────────────────────────────────────────
  function renderMix(){
    if(!itemsParaCalculo.length)return e('div',{className:'section'},
      e('div',{className:'alerta warn'},e('span',{className:'alerta-icon'},'⚠️'),
        e('span',null,'No hay ítems pendientes: ya está todo comprado.'))
    );
    return e('div',{className:'section'},
      e('div',{className:'alerta info'},
        e('span',{className:'alerta-icon'},'✓'),
        e('span',null,'Cada ítem al proveedor más barato. '+itemsParaCalculo.length+(usaCarritoEnCalculo?' ítems tildados en el carrito.':' de '+TODOS_ITEMS.length+' ítems faltantes (carrito vacío).'))
      ),
      e('div',{className:'cards-grid-lg'},
      ...Object.values(mix).map(({prov,items,subtotal})=>{
        return e('div',{key:prov.id,className:'prov-block'},
          e('div',{className:'prov-block-hdr'},
            e('div',{className:'prov-block-nombre'},
              e('span',{className:'dot',style:{background:prov.color}}),
              e('span',{style:{color:prov.color}},prov.nombre),
              compras[prov.id]>0&&e('span',{style:{fontSize:'0.7rem',fontWeight:400,color:'var(--c-text3)',marginLeft:4}},'🛒 '+fmt(compras[prov.id]))
            ),
            e('div',{className:'prov-block-total',style:{color:prov.color}},fmt(subtotal))
          ),
          ...items.map((item,idx)=>{
            const ahorro=item.seg?item.seg.total-item.total:null;
            return e('div',{key:item.id,className:'mix-item-row',style:{background:idx%2===0?'transparent':'rgba(0,0,0,0.015)'}},
              e('div',{className:'mix-item-nombre'},
                item.nombre,
                e('span',{style:{fontSize:'0.68rem',color:'var(--c-text3)',marginLeft:4}},'×'+item.cant)
              ),
              e('div',{className:'mix-item-right'},
                e('div',{className:'mix-item-total'},fmt(item.total)),
                e('div',{style:{fontSize:'0.65rem',color:'var(--c-text3)'}},fmt(item.u)+'/u'),
                ahorro&&ahorro>0&&e('div',{className:'mix-item-ahorro'},'ahorra '+fmt(ahorro)+' (–'+(ahorro/item.seg.total*100).toFixed(1)+'%) vs '+(item.seg.prov.nombre))
              )
            );
          })
        );
      })),
      e('div',{className:'total-box'},
        e('div',{className:'total-box-label'},'Total mix óptimo'),
        e('div',{className:'total-box-amount'},fmt(totalMix)),
        e('div',{className:'total-box-sub'},(usaCarritoEnCalculo?'Sobre '+itemsParaCalculo.length+' ítems del carrito':'Sobre '+itemsParaCalculo.length+' de '+TODOS_ITEMS.length+' ítems faltantes')+' · Comprado hasta ahora: '+fmt(totalComprado)),
      ),
      // Comparativa escenarios
      e('div',{className:'section-title',style:{paddingTop:12}},'Comparativa todos los escenarios'),
      e('div',{style:{background:'var(--c-surface)',borderRadius:'var(--radius)',overflow:'hidden',border:'1px solid var(--c-border)'}},
        e('table',{className:'resumen-table'},
          e('thead',null,e('tr',null,
            e('th',null,'Escenario'),e('th',null,'Total'),e('th',null,'Ahorro vs anterior'),
          )),
          e('tbody',null,
            ...(function(){
              const filas=[
                {label:'Todo a 1 prov.',val:b1?.total,base:true},
                {label:'Mejor dupla (2)',val:b2?.total},
                {label:'Mejor trio (3)', val:b3?.total},
                {label:'Mix óptimo ('+nAct+')', val:totalMix,best:true},
              ].filter(r=>r.val);
              return filas.map((row,idx)=>
                e('tr',{key:idx,className:row.best?'best-row':''},
                  e('td',null,(row.best?'🏆 ':'')+row.label),
                  e('td',null,fmtM(row.val)),
                  e('td',null,idx===0?'—':e('span',{style:{color:'var(--c-green)',fontWeight:600}},
                    '–'+((filas[idx-1].val-row.val)/filas[idx-1].val*100).toFixed(1)+'%'
                  ))
                )
              );
            })()
          )
        )
      )
    );
  }

  // ── RENDER ESCENARIOS ──────────────────────────────────────────────────────
  function renderEscenarios(){
    if(!itemsParaCalculo.length)return e('div',{className:'section'},
      e('div',{className:'alerta warn'},e('span',{className:'alerta-icon'},'⚠️'),
        e('span',null,'No hay ítems pendientes: ya está todo comprado.'))
    );

    // Tarjeta reutilizable (misma UI que antes) para un escenario dentro de un grupo/catálogo dado
    function cardEsc(esc,idx,arr,baseG,keyPrefix){
      if(!esc.r)return null;
      const ahorro=baseG-esc.r.total;
      const ahorroP=baseG>0?((ahorro/baseG)*100):0;
      const prev=idx>0?arr[idx-1].r?.total:null;
      const marginal=prev?prev-esc.r.total:0;
      const marginalP=prev?((marginal/prev)*100):0;
      const vsLabel=idx>0?arr[idx-1].short:'';
      const barW=baseG>0?(esc.r.total/baseG*100):0;
      const key=keyPrefix+'_'+esc.n;
      const isExp=expandEsc[key];
      const mainProv=esc.r.mainId?PROVEEDORES.find(p=>p.id===esc.r.mainId):null;

      return e('div',{key:key,className:'esc-card'+(esc.isBest?' best':esc.isBase?' base':'')},
        e('div',{className:'esc-hdr',onClick:()=>setExpandEsc(x=>({...x,[key]:!x[key]}))},
          e('div',null,
            e('div',{className:'esc-label',style:{color:esc.isBest?'var(--c-green)':esc.isBase?'var(--c-red)':'var(--c-text)'}},
              (esc.isBest?'🏆 ':esc.isBase?'📦 ':'')+esc.label
            ),
            e('div',{className:'esc-sub'},
              mainProv
                ? mainProv.nombre+(esc.r.fuera>0?' · '+esc.r.fuera+' ítem'+(esc.r.fuera>1?'s':'')+' que no cotiza, al mejor precio de otro':'')
                : esc.r.s.map(id=>PROVEEDORES.find(p=>p.id===id).nombre).join(' · ')
            )
          ),
          e('div',{className:'esc-right'},
            e('div',{className:'esc-total',style:{color:esc.isBest?'var(--c-green)':'inherit'}},fmtM(esc.r.total)),
            idx>0&&e('div',{className:'esc-pct'},'–'+marginalP.toFixed(1)+'% vs '+vsLabel),
            e('span',{style:{fontSize:'0.7rem',color:'var(--c-text3)'}},isExp?'▲':'▼')
          )
        ),
        e('div',{className:'bar-wrap'},
          e('div',{className:'bar',style:{width:barW+'%',background:esc.isBest?'var(--c-green)':esc.isBase?'var(--c-red)':'var(--c-accent)'}})
        ),
        e('div',{className:'esc-chips'},
          esc.isBase&&e('span',{className:'chip chip-red'},'Costo más alto'),
          idx>0&&marginal>5000&&e('span',{className:'chip chip-blue'},'Sumar proveedor ahorra '+fmt(marginal)),
          idx>0&&marginal<=5000&&e('span',{className:'chip chip-grey'},'Mejora mínima vs '+vsLabel),
          idx>0&&e('span',{className:'chip chip-green'},'Total vs 1 prov.: –'+fmt(ahorro)+' (–'+ahorroP.toFixed(1)+'%)')
        ),
        e('div',{className:'esc-provs'},
          ...esc.r.s.map(id=>{
            const p=PROVEEDORES.find(x=>x.id===id);
            return e('span',{key:id,className:'prov-pill',style:{background:p.color+'18',color:p.color}},
              e('span',{className:'dot',style:{background:p.color}}),p.nombre
            );
          })
        ),
        isExp&&e('div',{style:{borderTop:'1px solid var(--c-border)'}},
          ...Object.values(esc.r.desglose).map(({prov,items,subtotal})=>
            e('div',{key:prov.id,style:{borderLeft:'3px solid '+prov.color,margin:'8px 10px',paddingLeft:10}},
              e('div',{style:{display:'flex',justifyContent:'space-between',padding:'4px 0',fontWeight:700,fontSize:'0.82rem',color:prov.color}},
                e('span',null,prov.nombre),e('span',null,fmt(subtotal))
              ),
              ...items.map((item,ii)=>e('div',{key:item.id,style:{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:'0.75rem',borderTop:ii>0?'0.5px solid var(--c-border)':'none'}},
                e('span',{style:{color:'var(--c-text2)'}},item.nombre+' ×'+item.cant),
                e('span',{style:{fontWeight:600}},fmt(item.total))
              ))
            )
          ),
          e('div',{style:{height:8}})
        )
      );
    }

    // Un grupo por cada catálogo de proveedores con productos afines
    // (no tiene sentido comparar un corralón de hierros contra un sanitario de cloaca)
    const gruposRender=GRUPOS_AHORRO.map(g=>{
      const itemsG=itemsParaCalculo.filter(it=>g.catIds.includes(it.catId));
      if(!itemsG.length)return null;
      const provsG=provsActivos.filter(p=>g.provIds.includes(p.id));
      if(!provsG.length)return e('div',{key:g.id,className:'section'},
        e('div',{className:'section-title'},g.label),
        e('div',{className:'alerta warn'},e('span',{className:'alerta-icon'},'⚠️'),
          e('span',null,'No hay proveedores activos de este catálogo.'))
      );
      const idsG=provsG.map(p=>p.id);
      const b1G=bestUno(provsG,itemsG);
      const b2G=idsG.length>=2?bestN(2,idsG,itemsG):null;
      const b3G=idsG.length>=3?bestN(3,idsG,itemsG):null;
      const mixG={s:idsG,...calcSet(idsG,itemsG)};
      const baseG=b1G?.total||0;
      const escsG=[
        {n:1,label:"1 proveedor",short:"1 prov.",r:b1G,isBase:true},
        idsG.length>=2&&{n:2,label:"2 proveedores",short:"2 prov.",r:b2G},
        idsG.length>=3&&{n:3,label:"3 proveedores",short:"3 prov.",r:b3G},
        {n:5,label:"Mix óptimo ("+idsG.length+")",short:idsG.length+" prov.",r:mixG,isBest:true},
      ].filter(Boolean);
      return e('div',{key:g.id,className:'section'},
        e('div',{className:'section-title'},g.label),
        e('div',{style:{fontSize:'0.72rem',color:'var(--c-text3)',marginBottom:8}},
          itemsG.length+' ítem'+(itemsG.length>1?'s':'')+' de este catálogo · '+idsG.length+' proveedor'+(idsG.length>1?'es':'')+' activo'+(idsG.length>1?'s':'')
        ),
        e('div',{className:'cards-grid-lg'},
          ...escsG.map((esc,idx)=>cardEsc(esc,idx,escsG,baseG,g.id))
        )
      );
    }).filter(Boolean);

    return e('div',{className:'section'},
      e('div',{style:{fontSize:'0.8rem',color:'var(--c-text2)',marginBottom:10,lineHeight:1.5}},
        'Cuánto ahorrás sumando proveedores vs comprarle todo a uno solo, separado por catálogo de productos (no tiene sentido comparar un corralón contra un sanitario). Tocá para ver el desglose. '+
        (usaCarritoEnCalculo?'Calculado sobre los '+itemsParaCalculo.length+' ítems tildados en el carrito.':'Carrito vacío: calculado sobre todos los ítems faltantes.')
      ),
      ...gruposRender
    );
  }

  // ── RENDER FALTANTES ───────────────────────────────────────────────────────
  function Stepper(k,val,color,onSet){
    return e('div',{className:'stepper'},
      e('button',{onClick:()=>onSet(val-1)},'−'),
      e('input',{key:k+'_'+val,defaultValue:val,inputMode:'numeric',
        onBlur:ev=>onSet(ev.target.value),
        onKeyDown:ev=>{if(ev.key==='Enter')ev.target.blur();},
        style:color?{color:color,borderColor:color+'66'}:null}),
      e('button',{onClick:()=>onSet(val+1)},'+')
    );
  }

  function renderFaltantes(){
    let granTotal=0, sinCotizar=[];
    const bloques=CATEGORIAS.map(cat=>{
      const rows=cat.items.map(item=>{
        const c=cants[item.id]||{nec:item.cant,comp:0};
        const falt=Math.max(0,c.nec-c.comp);
        const rank=rankingItem(item.id,1,provsActivos);
        const best=rank[0]||null;
        const total=best&&falt>0?falt*best.u:0;
        if(falt>0&&!best)sinCotizar.push(item.nombre);
        granTotal+=total;
        return {item,c,falt,best,total};
      });
      const sub=rows.reduce((a,r)=>a+r.total,0);
      const pendientes=rows.filter(r=>r.falt>0);
      const completos=rows.filter(r=>r.falt===0);
      return {cat,sub,pendientes,completos};
    });
    // Solo categorías con algo pendiente se muestran arriba
    const bloquesPend=bloques.filter(b=>b.pendientes.length>0);
    // Todo lo ya comprado, de todas las categorías, junto y al final
    const todosCompletos=bloques.flatMap(b=>b.completos.map(r=>({...r,catNombre:b.cat.nombre})));

    function tarjeta({item,c,falt,best,total}){
      const abierto=!!expandFalt[item.id];
      const pctFalta=c.nec>0?Math.min(100,(falt/c.nec)*100):0;
      const colorUrg=pctFalta>66?'var(--c-red)':pctFalta>33?'var(--c-orange)':'var(--c-green)';
      const qtyProv=falt>0?falt:c.nec;
      return e('div',{key:item.id,className:'item-card',style:{padding:'10px 12px',opacity:falt===0?0.5:1}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:8,cursor:'pointer'},
           onClick:()=>setExpandFalt(x=>({...x,[item.id]:!x[item.id]}))},
          e('span',{className:'item-nombre'},item.nombre),
          e('div',{style:{display:'flex',alignItems:'baseline',gap:8}},
            falt===0
              ? e('span',{style:{fontSize:'0.7rem',fontWeight:600,color:'var(--c-green)'}},'✓ Completo')
              : best
                ? e('div',{style:{textAlign:'right'}},
                    e('div',{style:{fontSize:'0.9rem',fontWeight:700,color:best.prov.color}},fmt(total)),
                    e('div',{style:{fontSize:'0.65rem',color:'var(--c-text3)'}},'Faltan '+falt)
                  )
                : e('span',{className:'consultar'},'Faltan '+falt+' · sin cotizar'),
            e('span',{style:{fontSize:'0.65rem',color:abierto?'var(--c-green)':'var(--c-text3)',border:'1px solid '+(abierto?'var(--c-green)':'var(--c-border)'),borderRadius:4,padding:'2px 5px'}},abierto?'▲':'▼')
          )
        ),
        falt>0&&e('div',{style:{height:3,background:'var(--c-border)',borderRadius:2,marginTop:7,overflow:'hidden'}},
          e('div',{style:{height:'100%',width:pctFalta+'%',background:colorUrg,borderRadius:2}})
        ),
        abierto&&e('div',{className:'item-body',style:{marginTop:7}},
          ...provsActivos.map(p=>{
            const u=pu(p,item.id);
            const t=u?u*qtyProv:null;
            const pend=isPend(p,item.id)&&!t;
            return {p,u,t,pend};
          }).sort((a,b)=>{
            if(a.t==null&&b.t==null)return 0;
            if(a.t==null)return 1;
            if(b.t==null)return -1;
            return a.t-b.t;
          }).map(({p,u,t,pend},idx)=>{
            const isWin=idx===0&&t!==null;
            const pos=t!==null?idx:-1;
            return e('div',{key:p.id,className:'item-prov-row'+(isWin?' winner':'')},
              e('div',{className:'item-prov-name'},
                e('span',{className:'dot',style:{background:p.color}}),
                p.nombre,
                pos>=0&&e('span',{className:'rank-chip '+(pos===0?'rank-1':pos===1?'rank-2':'rank-n'),style:{marginLeft:4}},pos+1+'°')
              ),
              pend
                ? e('span',{className:'consultar'},'consultar')
                : t!==null
                  ? e('div',{className:'item-prov-right'},
                      e('div',{className:'item-prov-total',style:{color:isWin?p.color:'inherit'}},fmt(t)),
                      e('div',{className:'item-prov-unit'},fmt(u)+'/u')
                    )
                  : e('span',{style:{fontSize:'0.7rem',color:'var(--c-text3)'}},'—')
            );
          })
        ),
        abierto&&e('div',{style:{display:'flex',alignItems:'center',gap:12,marginTop:8,flexWrap:'wrap'}},
          e('div',null,
            e('div',{className:'falt-label'},'Necesito'),
            Stepper(item.id+'_nec',c.nec,null,v=>setCant(item.id,'nec',v))
          ),
          e('div',null,
            e('div',{className:'falt-label'},'Compré'),
            Stepper(item.id+'_comp',c.comp,best?best.prov.color:null,v=>setCant(item.id,'comp',v))
          ),
          e('div',null,
            e('div',{className:'falt-label'},'Consumido'),
            Stepper(item.id+'_cons',c.cons||0,'var(--c-orange)',v=>setCant(item.id,'cons',v))
          ),
          e('div',{style:{marginLeft:'auto',textAlign:'right'}},
            e('div',{className:'falt-label'},'Faltan'),
            e('div',{style:{fontSize:'1rem',fontWeight:800,color:falt>0?'var(--c-text)':'var(--c-green)'}},falt)
          )
        ),
        abierto&&(function(){
          const cons=c.cons||0;
          const stock=c.comp-cons;
          const sobre=stock<0;
          let ritmo=null;
          if(cons>0&&fechaInicioConsumo){
            const dias=Math.max(1,(Date.now()-new Date(fechaInicioConsumo+'T00:00:00').getTime())/86400000);
            const semanal=cons/dias*7;
            if(semanal>0)ritmo=stock>0?(stock/semanal):0;
          }
          return e('div',{style:{marginTop:8,padding:'6px 9px',borderRadius:6,background:sobre?'rgba(239,68,68,0.12)':'rgba(120,120,120,0.08)',fontSize:'0.72rem',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:6}},
            e('span',{style:{color:'var(--c-text3)'}},'Stock en obra (Compré − Consumido)'),
            e('div',{style:{display:'flex',alignItems:'center',gap:10}},
              sobre&&e('span',{style:{color:'var(--c-red)',fontWeight:700}},'⚠️ consumido supera lo comprado'),
              ritmo!==null&&e('span',{style:{color:'var(--c-text3)'}},'≈ '+ritmo.toFixed(1)+' sem. de stock al ritmo actual'),
              e('span',{style:{fontWeight:800,color:sobre?'var(--c-red)':'var(--c-text)'}},stock)
            )
          );
        })()
      );
    }

    function textoReporte(){
      const fecha=new Date().toLocaleDateString('es-AR');
      let txt='📋 Resumen de obra — '+fecha+'\n\n';
      let huboItems=false;
      TODOS_ITEMS.forEach(item=>{
        const c=cants[item.id]||CANT_DEFAULT[item.id]||{nec:item.cant,comp:0,cons:0};
        if(!(c.comp>0))return;
        huboItems=true;
        const cons=c.cons||0;
        const stock=c.comp-cons;
        txt+='• '+item.nombre+': comprado '+c.comp+' / necesito '+c.nec+(cons>0?' / consumido '+cons:'')+' → stock en obra '+stock+(stock<0?' ⚠️':'')+'\n';
      });
      if(!huboItems)txt+='(Todavía no hay nada marcado como comprado.)\n';
      txt+='\n¿Me confirmás cuánto se consumió de cada uno para ajustar el stock en obra?';
      return txt;
    }
    async function copiarReporte(){
      try{ await navigator.clipboard.writeText(textoReporte()); setReporteCopiado(true); setTimeout(()=>setReporteCopiado(false),2000); }catch(e){}
    }

    return e('div',{className:'section'},
      e('div',{className:'alerta info'},
        e('span',{className:'alerta-icon'},'🧮'),
        e('span',null,'Ajustá "Necesito", "Compré" y "Consumido" (lo reporta la arquitecta) con +/− o tocando el número. El costo usa el mejor precio unitario vigente de los proveedores activos.')
      ),
      e('div',{style:{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',marginBottom:14}},
        e('button',{className:'cat-toggle-btn',onClick:()=>setMostrarReporte(x=>!x)},mostrarReporte?'▲ Ocultar reporte para la arquitecta':'📤 Generar reporte para la arquitecta'),
        e('label',{style:{fontSize:'0.7rem',color:'var(--c-text3)',display:'flex',alignItems:'center',gap:5}},
          'Medir ritmo de consumo desde:',
          e('input',{type:'date',value:fechaInicioConsumo,onChange:ev=>cambiarFechaInicioConsumo(ev.target.value),
            style:{fontSize:'0.7rem',padding:'2px 5px',borderRadius:4,border:'1px solid var(--c-border)',background:'var(--c-surface)',color:'var(--c-text)'}})
        )
      ),
      mostrarReporte&&e('div',{style:{marginBottom:16}},
        e('textarea',{readOnly:true,value:textoReporte(),style:{width:'100%',minHeight:160,fontSize:'0.74rem',padding:9,borderRadius:8,border:'1px solid var(--c-border)',background:'var(--c-surface)',color:'var(--c-text)',fontFamily:'inherit',boxSizing:'border-box'}}),
        e('button',{className:'cat-toggle-btn',style:{marginTop:6},onClick:copiarReporte},reporteCopiado?'✓ Copiado':'Copiar al portapapeles')
      ),
      bloquesPend.length>0&&e('div',{style:{marginBottom:18}},
        e('div',{className:'section-title'},'📋 Resumen de faltantes'),
        e('div',{style:{background:'var(--c-surface)',borderRadius:'var(--radius)',overflow:'hidden',border:'1px solid var(--c-border)'}},
          e('table',{className:'resumen-table'},
            e('thead',null,e('tr',null,
              e('th',null,'Ítem'),e('th',{style:{textAlign:'right'}},'Faltan'),e('th',{style:{textAlign:'right'}},'Total $')
            )),
            e('tbody',null,
              ...bloquesPend.flatMap(({cat,sub,pendientes})=>{
                const exp=expandResumenCat[cat.id]!==false;
                const filas=[
                  e('tr',{key:cat.id+'_hdr',onClick:()=>setExpandResumenCat(x=>({...x,[cat.id]:!exp})),
                     style:{cursor:'pointer',background:'rgba(120,120,120,0.10)'}},
                    e('td',{colSpan:3,style:{padding:'7px 10px',fontWeight:700,fontSize:'0.7rem',textTransform:'uppercase',letterSpacing:'0.05em',color:'var(--c-text2)'}},
                      (exp?'▾ ':'▸ ')+cat.nombre+' · '+pendientes.length+' ítem'+(pendientes.length>1?'s':'')+' · '+fmt(sub)
                    )
                  )
                ];
                if(exp){
                  pendientes.forEach(({item,falt,total,best})=>{
                    filas.push(e('tr',{key:item.id},
                      e('td',null,item.nombre),
                      e('td',{style:{textAlign:'right',fontWeight:700}},falt),
                      e('td',{style:{textAlign:'right',fontWeight:700,color:best?best.prov.color:'var(--c-text3)'}},best?fmt(total):'sin cotizar')
                    ));
                  });
                }
                return filas;
              })
            )
          )
        )
      ),
      pendCotizar.length>0&&e('div',{style:{marginBottom:18}},
        e('div',{className:'section-title'},'📌 Pendiente de cotizar y dimensionar'),
        e('div',{style:{fontSize:'0.68rem',color:'var(--c-text3)',marginBottom:6}},'Todavía no tienen ítems ni proveedores cargados — esto es solo una lista de lo que falta pedir. Los estimados NO están incluidos en "Costo de lo que falta comprar".'),
        e('div',{style:{background:'var(--c-surface)',borderRadius:'var(--radius)',border:'1px solid var(--c-border)',overflow:'hidden'}},
          ...pendCotizar.map((p,idx)=>{
            const isEdit=editPend===p.id;
            return e('div',{key:p.id,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',borderTop:idx>0?'1px solid var(--c-border)':'none',fontSize:'0.78rem',gap:8}},
              e('span',null,p.nombre),
              e('div',{style:{display:'flex',alignItems:'center',gap:8}},
                isEdit
                  ? e('input',{className:'compra-input',style:{width:130,borderColor:'var(--c-border2)'},autoFocus:true,defaultValue:p.estimado||'',placeholder:'estimado $',inputMode:'numeric',
                      onBlur:ev=>actualizarEstimadoPend(p.id,ev.target.value),
                      onKeyDown:ev=>{if(ev.key==='Enter')actualizarEstimadoPend(p.id,ev.target.value);if(ev.key==='Escape')setEditPend(null);}})
                  : e('div',{style:{display:'flex',alignItems:'center',gap:5}},
                      e('span',{style:{color:p.estimado>0?'var(--c-text)':'var(--c-text3)',fontWeight:700}},
                        p.estimado>0?fmt(p.estimado)+' (est.)':'sin estimar'
                      ),
                      e('button',{onClick:()=>setEditPend(p.id),title:'Editar estimado',style:{fontSize:'0.7rem',color:'var(--c-accent)',background:'none',border:'none',cursor:'pointer',padding:'2px 4px'}},'✎')
                    ),
                e('button',{onClick:()=>eliminarPend(p.id),title:'Ya lo agregué como categoría real, sacar de esta lista',style:{fontSize:'0.7rem',color:'var(--c-red)',background:'none',border:'none',cursor:'pointer'}},'✕')
              )
            );
          })
        ),
        e('div',{style:{fontSize:'0.72rem',color:'var(--c-text3)',marginTop:6,textAlign:'right'}},
          'Suma de estimados: '+fmt(pendCotizar.reduce((a,p)=>a+(p.estimado||0),0))
        )
      ),
      bloquesPend.length===0&&e('div',{style:{fontSize:'0.8rem',color:'var(--c-text3)',textAlign:'center',padding:'20px 0'}},'✓ No te falta comprar nada.'),
      ...bloquesPend.map(({cat,sub,pendientes})=>
        e('div',{key:cat.id},
          e('div',{className:'cat-header',style:{cursor:'default'}},
            e('span',{className:'cat-label'},cat.nombre),
            e('span',{style:{fontSize:'0.78rem',fontWeight:700,color:'var(--c-text)'}},fmt(sub))
          ),
          e('div',{className:'cards-grid'}, ...pendientes.map(tarjeta))
        )
      ),
      e('div',{className:'total-box'},
        e('div',{className:'total-box-label'},'Costo de lo que falta comprar'),
        e('div',{className:'total-box-amount'},fmt(granTotal)),
        e('div',{className:'total-box-sub'},'Cada faltante al mejor precio unitario vigente'+(sinCotizar.length?' · Sin cotizar: '+sinCotizar.join(', '):''))
      ),
      todosCompletos.length>0&&e('div',{style:{display:'flex',alignItems:'center',gap:8,margin:'24px 4px 6px'}},
        e('div',{style:{flex:1,height:1,background:'var(--c-border2)'}}),
        e('span',{style:{fontSize:'0.65rem',fontWeight:600,color:'var(--c-text3)',textTransform:'uppercase',letterSpacing:'0.05em',whiteSpace:'nowrap'}},'✓ Ya comprado ('+todosCompletos.length+')'),
        e('div',{style:{flex:1,height:1,background:'var(--c-border2)'}})
      ),
      todosCompletos.length>0&&e('div',{className:'cards-grid'}, ...todosCompletos.map(tarjeta))
    );
  }


  // ── RENDER CARRITO ─────────────────────────────────────────────────────────
  function renderCarrito(){
    const cartItems=TODOS_ITEMS.filter(i=>carrito[i.id]>0).map(i=>({...i,cant:carrito[i.id]}));
    const hay=cartItems.length>0;

    // Mapeo anónimo estable (Corralón A, B, C…) para cuando se oculta el nombre real
    const anonMap={};
    provsActivos.forEach((p,idx)=>{ anonMap[p.id]=String.fromCharCode(65+idx); });
    function pNombre(prov){ return ocultarProveedor?('Corralón '+(anonMap[prov.id]||'?')):prov.nombre; }
    function pColor(prov){ return ocultarProveedor?'var(--c-text3)':prov.color; }
    function nombreId(id){ const p=PROVEEDORES.find(x=>x.id===id); return p?pNombre(p):id; }

    let mixC={},totalC=0,escRows=[];
    if(hay){
      const r=calcMix(provsActivos,cartItems); mixC=r.mix; totalC=r.total;
      const nProvMix=Object.keys(mixC).length;
      const u1=bestUno(provsActivos,cartItems);
      const d2=bestN(2,idsActivos,cartItems);
      const t3=bestN(3,idsActivos,cartItems);
      escRows=[
        {label:'🏆 Mix óptimo ('+nProvMix+' prov.)',val:totalC},
        t3?{label:'Mejor trío: '+t3.s.map(nombreId).join(' + '),val:t3.total}:null,
        d2?{label:'Mejor dupla: '+d2.s.map(nombreId).join(' + '),val:d2.total}:null,
        u1?{label:'Todo a uno: '+nombreId(u1.mainId)+(u1.fuera>0?' (+'+u1.fuera+' ítem'+(u1.fuera>1?'s':'')+' que no cotiza, en otro)':''),val:u1.total}:null,
      ].filter(Boolean).sort((a,b)=>a.val-b.val);
    }

    // Separa cada categoría en pendientes (Necesito > Compré) y ya completadas
    const bloques=CATEGORIAS.map(cat=>{
      const pendientes=[],completos=[];
      cat.items.forEach(item=>{
        const c=cants[item.id]||CANT_DEFAULT[item.id]||{nec:item.cant,comp:0};
        (Math.max(0,c.nec-c.comp)>0?pendientes:completos).push(item);
      });
      return {cat,pendientes,completos};
    }).filter(b=>b.pendientes.length>0||b.completos.length>0);

    function tarjetaCarrito(item,completo){
      const enCarro=carrito[item.id]>0;
      const rank=rankingItem(item.id,1,provsActivos);
      const best=rank[0]||null;
      return e('div',{key:item.id,className:'item-card',style:{padding:'9px 12px',opacity:enCarro?1:(completo?0.55:0.7)}},
        e('div',{style:{display:'flex',alignItems:'center',gap:9,cursor:'pointer'},onClick:()=>toggleCarrito(item.id)},
          e('input',{type:'checkbox',checked:enCarro,onClick:ev=>ev.stopPropagation(),onChange:()=>toggleCarrito(item.id),
            style:{width:16,height:16,accentColor:'#4ADE80',flexShrink:0,cursor:'pointer'}}),
          e('span',{className:'item-nombre'},item.nombre),
          completo&&!enCarro&&e('span',{style:{fontSize:'0.65rem',color:'var(--c-green)',marginLeft:'auto'}},'✓ + agregar'),
          enCarro&&best&&e('span',{style:{marginLeft:'auto',fontSize:'0.82rem',fontWeight:700,color:pColor(best.prov)}},fmt(best.u*carrito[item.id]))
        ),
        enCarro&&e('div',{style:{display:'flex',alignItems:'center',gap:12,marginTop:7,flexWrap:'wrap'}},
          e('div',null,
            e('div',{className:'falt-label'},'Cantidad'),
            Stepper('car_'+item.id,carrito[item.id],best?pColor(best.prov):null,v=>setCarritoQty(item.id,v))
          ),
          best&&e('div',{style:{marginLeft:'auto',textAlign:'right'}},
            e('div',{className:'falt-label'},'Mejor precio'),
            e('div',{style:{fontSize:'0.75rem',fontWeight:600,color:pColor(best.prov)}},pNombre(best.prov)+' · '+fmt(best.u)+'/u')
          )
        )
      );
    }

    return e('div',{className:'section'},
      e('div',{className:'alerta info'},
        e('span',{className:'alerta-icon'},'🛒'),
        e('span',null,'Tildá los ítems de tu próxima compra y ajustá cantidades: abajo te digo dónde conviene comprarla. Los ya completados quedan más abajo, pero podés tildarlos igual para pedir más.')
      ),
      e('div',{style:{display:'flex',gap:8,marginBottom:6,flexWrap:'wrap'}},
        e('button',{className:'cat-toggle-btn',onClick:cargarFaltantes},'⚡ Cargar todos los faltantes'),
        hay&&e('button',{className:'cat-toggle-btn',onClick:vaciarCarrito},'🗑 Vaciar carrito'),
        e('button',{className:'cat-toggle-btn',onClick:()=>setOcultarProveedor(v=>!v)},
          ocultarProveedor?'🙈 Nombres ocultos (mostrar)':'👁 Ocultar nombre del corralón'
        )
      ),
      ocultarProveedor&&e('div',{className:'alerta warn'},
        e('span',{className:'alerta-icon'},'🙈'),
        e('span',null,'Nombres de proveedor ocultos — podés compartir esta lista para pedir que te igualen precio sin revelar quién cotizó qué.')
      ),
      bloques.length===0&&e('div',{style:{fontSize:'0.8rem',color:'var(--c-text3)',textAlign:'center',padding:'20px 0'}},'No hay ítems cargados.'),
      ...bloques.map(({cat,pendientes,completos})=>
        e('div',{key:cat.id},
          e('div',{className:'cat-header',style:{cursor:'default'}},
            e('span',{className:'cat-label'},cat.nombre),
            e('span',{style:{fontSize:'0.65rem',color:'var(--c-text3)'}},cat.items.filter(i=>carrito[i.id]>0).length+' en el carrito')
          ),
          e('div',{className:'cards-grid'}, ...pendientes.map(item=>tarjetaCarrito(item,false))),
          completos.length>0&&e('div',{style:{display:'flex',alignItems:'center',gap:8,margin:'12px 4px 6px'}},
            e('div',{style:{flex:1,height:1,background:'var(--c-border2)'}}),
            e('span',{style:{fontSize:'0.65rem',fontWeight:600,color:'var(--c-text3)',textTransform:'uppercase',letterSpacing:'0.05em',whiteSpace:'nowrap'}},'✓ Ya comprados ('+completos.length+') · tildá para pedir más'),
            e('div',{style:{flex:1,height:1,background:'var(--c-border2)'}})
          ),
          completos.length>0&&e('div',{className:'cards-grid'}, ...completos.map(item=>tarjetaCarrito(item,true)))
        )
      ),
      hay&&e('div',null,
        e('div',{className:'section-title',style:{paddingTop:14}},'📋 Lista para pedir precio'),
        e('div',{style:{background:'var(--c-surface)',borderRadius:'var(--radius)',overflow:'hidden',border:'1px solid var(--c-border)'}},
          e('table',{className:'resumen-table'},
            e('thead',null,e('tr',null,
              e('th',null,'Artículo'),e('th',null,'Cantidad'),e('th',null,'Precio a igualar'),e('th',null,'Total'),
            )),
            e('tbody',null,
              ...cartItems.map(item=>{
                const best=rankingItem(item.id,1,provsActivos)[0]||null;
                const total=best?best.u*item.cant:null;
                return e('tr',{key:item.id},
                  e('td',null,item.nombre),
                  e('td',null,item.cant),
                  e('td',null,best?fmt(best.u):e('span',{className:'consultar'},'sin cotizar')),
                  e('td',null,best?fmt(total):'—')
                );
              }),
              e('tr',{className:'best-row'},
                e('td',null,'TOTAL'),
                e('td',null,''),
                e('td',null,''),
                e('td',null,fmt(cartItems.reduce((a,item)=>{ const best=rankingItem(item.id,1,provsActivos)[0]; return a+(best?best.u*item.cant:0); },0)))
              )
            )
          )
        ),
        e('div',{className:'section-title',style:{paddingTop:14}},'🏆 Dónde comprar este pedido'),
        e('div',{className:'cards-grid-lg'},
          ...Object.values(mixC).map(({prov,items,subtotal})=>
            e('div',{key:prov.id,className:'prov-block'},
              e('div',{className:'prov-block-hdr'},
                e('div',{className:'prov-block-nombre'},
                  e('span',{className:'dot',style:{background:pColor(prov)}}),
                  e('span',{style:{color:pColor(prov)}},pNombre(prov))
                ),
                e('div',{className:'prov-block-total',style:{color:pColor(prov)}},fmt(subtotal))
              ),
              ...items.map(it=>{
                const ah=it.seg?(it.seg.total-it.total):0;
                return e('div',{key:it.id,className:'mix-item-row'},
                  e('div',{className:'mix-item-nombre'},
                    it.nombre,
                    e('span',{style:{fontSize:'0.68rem',color:'var(--c-text3)',marginLeft:4}},'×'+it.cant)
                  ),
                  e('div',{className:'mix-item-right'},
                    e('div',{className:'mix-item-total'},fmt(it.total)),
                    e('div',{style:{fontSize:'0.65rem',color:'var(--c-text3)'}},fmt(it.u)+'/u'),
                    ah>0&&e('div',{className:'mix-item-ahorro'},'ahorra '+fmt(ah)+' (–'+(ah/it.seg.total*100).toFixed(1)+'%) vs '+pNombre(it.seg.prov))
                  )
                );
              })
            )
          )
        ),
        e('div',{style:{background:'var(--c-surface)',borderRadius:'var(--radius)',overflow:'hidden',border:'1px solid var(--c-border)',marginTop:10}},
          e('table',{className:'resumen-table'},
            e('thead',null,e('tr',null,
              e('th',null,'Escenario'),e('th',null,'Total'),e('th',null,'vs mejor'),
            )),
            e('tbody',null,
              ...escRows.map((row,idx)=>
                e('tr',{key:idx,className:idx===0?'best-row':''},
                  e('td',null,row.label),
                  e('td',null,fmt(row.val)),
                  e('td',null,idx===0?'—':e('span',{style:{color:'var(--c-red)',fontWeight:600}},
                    '+'+(((row.val-escRows[0].val)/escRows[0].val)*100).toFixed(1)+'%'
                  ))
                )
              )
            )
          )
        ),
        e('div',{className:'total-box',style:{marginTop:10}},
          e('div',{className:'total-box-label'},'Total del carrito (mix óptimo)'),
          e('div',{className:'total-box-amount'},fmt(totalC)),
          e('div',{className:'total-box-sub'},cartItems.length+' ítems · cada uno al mejor precio vigente entre proveedores activos')
        )
      )
    );
  }

  const TABS=[
    {id:'faltantes',  label:'🧮 Faltantes'},
    {id:'carrito',    label:'🛒 Carrito'},
    {id:'mix',        label:'🏆 Mix óptimo'},
    {id:'escenarios', label:'💰 Ahorro'},
  ];

  return e('div',{className:'app'},
    // Header
    e('div',{className:'hdr'},
      e('h1',null,'🏗 Comparador de Obra'),
      e('p',null,'Cañuelas, Buenos Aires · '+nAct+' de '+PROVEEDORES.length+' proveedores activos · precios jul-ago/26 (⚠️ LH al 22/06) · '+APP_VERSION),
      e('div',{className:'hdr-provs'},
        ...PROVEEDORES.map(p=>{
          const off=activos[p.id]===false;
          return e('button',{key:p.id,className:'hdr-prov'+(off?' off':''),onClick:()=>toggleProv(p.id),title:off?'Tocá para incluir':'Tocá para excluir'},
            e('span',{className:'dot',style:{background:off?'var(--c-text3)':p.color}}),
            e('span',null,p.nombre),
            off&&e('span',{style:{fontSize:'0.65rem',opacity:0.8}},'✕')
          );
        })
      ),
      e('p',{style:{fontSize:'0.65rem',color:'rgba(255,255,255,0.5)',marginTop:6}},
        'Tocá un proveedor para incluirlo o excluirlo de las comparaciones'
      )
    ),

    // Compras (siempre visible)
    renderCompras(),

    // Tabs
    e('div',{className:'tabs-wrap'},
      e('div',{className:'tabs'},
        ...TABS.map(t=>e('button',{key:t.id,className:'tab-btn'+(tab===t.id?' active':''),onClick:()=>setTab(t.id)},t.label))
      )
    ),

    tab==='faltantes'&&renderFaltantes(),
    tab==='carrito'&&renderCarrito(),
    tab==='mix'&&renderMix(),
    tab==='escenarios'&&renderEscenarios(),
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
